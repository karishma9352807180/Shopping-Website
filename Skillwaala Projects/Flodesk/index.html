<head>

    <title>Document</title>
    <style>
        *{
            
            font-family: Arial, Helvetica, sans-serif;
        }
        div{
            border: 2px solid black;
            margin: auto;

            width: 600px;
            height: 600px;
        }
        div h1{
            font-family: serif;
        }
        div p{
            text-align: center;
        }

        input{
            margin-left: 150px;
            width: 250px;
            border-radius: 10px;
            padding: 13px;
            margin-top: 10px;
            border-color: rgb(227, 218, 218);
        }
    </style>
</head>
<body>
    <div>
        <h1>
            Flodesk
        </h1>
        <b><p style="font-size: 25px;">Welcome Back!</p></b>

            <input type="email" placeholder="Enter your email">
            <br>
            <input type="password" placeholder="Enter your password">
            <br>
            <button>Log in to Flodesk</button>
        </form>
        <p>Not a member? <a href="">Sign up <br>Forgot your password?</a> </p>
        
        <p>By continuing, you agree to Flodesk's terms <br> and acknowledge you've read our privacy policy</p>
    </div>
